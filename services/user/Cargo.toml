[package]
name = "user"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.40", features = ["serde"] }
diesel = { version = "2.2.0", features = ["chrono", "postgres", "serde_json", "uuid"] }
# build libpq and openssl as part of the build process
# uncomment these lines if you run into setup issues
# pq-sys = { version = "0.6", features = ["bundled"] }
# openssl-sys = { version = "0.9.100", features = ["vendored"] } 
dotenvy = "0.15"
errors = { version = "0.1.0", path = "../../libs/errors" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.15.1", features = ["serde", "v4"] }
